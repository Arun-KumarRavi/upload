# ============================================================================
# Docker Compose for Local Development
# ============================================================================
# Services:
# - frontend (React + Nginx)
# - backend (Node.js Express)
# - mysql (Database)
# - redis (Cache/Sessions) - Optional
# ============================================================================

version: '3.9'

services:
  # ---- Frontend Service ----
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: db4fresh-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:4000
    depends_on:
      - backend
    networks:
      - db4fresh
    volumes:
      - ./src:/app/src  # Hot reload during development
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- Backend Service ----
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: db4fresh-backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=admin
      - DB_PASSWORD=db4fresh_secure_password
      - DB_NAME=mydb
      - LOG_LEVEL=debug
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - db4fresh
    volumes:
      - ./backend:/app  # Hot reload
      - ./backend/node_modules:/app/node_modules
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---- MySQL Database ----
  mysql:
    image: mysql:8.0
    container_name: db4fresh-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root_secure_password
      - MYSQL_DATABASE=mydb
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=db4fresh_secure_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - db4fresh
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "admin", "-pdb4fresh_secure_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---- Redis Cache (Optional) ----
  redis:
    image: redis:7-alpine
    container_name: db4fresh-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - db4fresh
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: redis-server --appendonly yes

networks:
  db4fresh:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
